name: build

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "expected a stable vX.Y.Z tag" >&2; exit 1; }
      - name: install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang just pkg-config libsdl3-dev libsdl3-image-dev libsdl3-ttf-dev libfontconfig-dev libdbus-1-dev libudev-dev libwayland-dev dbus-daemon fonts-dejavu-core labwc shellcheck desktop-file-utils zstd
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ github.token }}
          release: dev-2026-10
      - name: check and test
        run: |
          just check test test-drag smoke check-packaging
      - name: archive
        run: just bundle
      - uses: actions/upload-artifact@v7
        with:
          path: build/release/stuff-linux-${{ matrix.arch }}.tar.zst
          archive: false
          if-no-files-found: error

  aur-check:
    needs: linux
    runs-on: ubuntu-26.04
    container: archlinux:base-devel
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: install package tools and dependencies
        run: pacman -Syu --noconfirm --needed git just odin dbus fontconfig hicolor-icon-theme sdl3 sdl3_image sdl3_ttf systemd-libs udisks2 wayland xdg-utils ttf-dejavu namcap desktop-file-utils
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: stuff-*
          path: build/release
          merge-multiple: true
      - name: build and check AUR packages
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- just test-packaging
