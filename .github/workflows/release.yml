name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-slim
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: stuff-*
          path: build/release
          merge-multiple: true
      - uses: hyperpuncher/release-notes@v1
        id: notes
      - name: publish release
        env:
          NOTES: ${{ steps.notes.outputs.path }}
        run: gh release create "$GITHUB_REF_NAME" build/release/stuff-linux-*.tar.zst --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$NOTES"

  aur:
    needs: release
    uses: ./.github/workflows/aur.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      AUR_KEY: ${{ secrets.AUR_KEY }}
