name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-slim
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: stuff-*
          path: build/release
          merge-multiple: true
      - name: checksum archives
        run: (cd build/release && sha256sum stuff-linux-*.tar.zst > SHA256SUMS)
      - uses: hyperpuncher/release-notes@v1
        id: notes
      - uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            build/release/stuff-linux-*.tar.zst
            build/release/SHA256SUMS
          fail_on_unmatched_files: true

  aur:
    needs: release
    uses: ./.github/workflows/aur.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      AUR_KEY: ${{ secrets.AUR_KEY }}
